<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6f4f">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: https://*.supabase.co; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://*.supabase.co; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chores">
<title>Family Chores</title>
<meta name="description" content="Chores, swaps, scores and pocket money for our family.">
<style>
  html,body{margin:0;background:#f6f5f3;color:#1f1f1f;font:16px/1.55 "Segoe UI",system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
  :root{--t:#2f6f4f;--t2:#e3f2f2;--dim:#5f5f5f;--line:#e2e0dd}
  *{box-sizing:border-box} a{color:var(--t)} button{font:inherit;cursor:pointer}
  :focus-visible{outline:3px solid #1f1f1f;outline-offset:2px}
  .skip{position:absolute;left:-999px} .skip:focus{left:8px;top:8px;z-index:9;background:#fff;padding:8px}
  header{position:sticky;top:0;z-index:5;background:var(--t);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
  header b{flex:1;font-size:15px} header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:99px;padding:6px 12px;font-size:13px}
  main{max-width:760px;margin:0 auto;padding:18px 16px 90px}
  h1{font-size:26px;line-height:1.2;margin:6px 0 8px} h2{font-size:20px;margin:22px 0 8px} h3{font-size:17px;margin:0 0 6px}
  .muted{color:var(--dim);font-size:14px} .card h2{margin-top:0}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;margin:12px 0}
  .btn{display:inline-block;background:var(--t);color:#fff;border:0;border-radius:8px;padding:12px 18px;text-decoration:none;font-weight:600;min-height:44px}
  .btn.alt{background:#fff;color:var(--t);border:1px solid var(--t)}
  .tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
  .tabs a{flex:1;text-align:center;padding:12px 0;text-decoration:none;color:var(--dim);font-size:13px;font-weight:600;min-height:44px}
  .tabs a.on{color:var(--t);box-shadow:inset 0 3px var(--t)}
  .hlinks{display:none} aside{display:none}
  @media (min-width:1000px){
    .tabs{display:none} main{padding-bottom:40px;margin:0}
    .hlinks{display:flex;gap:4px} .hlinks a{color:#fff;text-decoration:none;font-size:14px;font-weight:600;padding:6px 12px;border-radius:99px} .hlinks a.on{background:rgba(255,255,255,.2)}
    .wrap{display:grid;grid-template-columns:280px minmax(0,800px);gap:32px;justify-content:center;padding:0 24px}
    .wrap:has(aside:empty){grid-template-columns:minmax(0,800px)} aside:empty{display:none}
    aside{display:block;position:sticky;top:64px;align-self:start;max-height:calc(100vh - 80px);overflow:auto;padding:16px 0}
  }
  .list{list-style:none;margin:0;padding:0} .list>li{margin:0}
  .row{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
  .card .row{border:0;border-top:1px solid var(--line);border-radius:0;margin:0;padding:10px 0}
  .emo{font-size:26px;width:34px;text-align:center;flex:none} .grow{flex:1;min-width:0}
  .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .mini{background:var(--t);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-weight:600;min-height:40px;min-width:44px}
  .mini.alt{background:#fff;color:var(--t);border:1px solid var(--t)}
  .tag{font-size:12px;font-weight:700;border-radius:99px;padding:4px 10px;white-space:nowrap} .tag.ok{background:#dff6dd;color:#0b5a0b} .tag.wait{background:#fff4ce;color:#6b5000}
  .notice{display:block;background:#fff8e1;border-color:#f1dc8f;color:#1f1f1f;text-decoration:none;font-weight:600}
  .seg{display:inline-flex;border:1px solid var(--t);border-radius:99px;overflow:hidden;margin:4px 0 8px} .seg a{padding:8px 16px;text-decoration:none;color:var(--t);font-weight:600} .seg a.on{background:var(--t);color:#fff}
  .form{display:grid;gap:12px;margin-top:12px} .form label{display:grid;gap:4px;font-weight:600;font-size:14px}
  .form input,.form select{font:inherit;padding:10px;border:1px solid #8a8681;border-radius:8px;background:#fff;min-height:44px}
  .form .chk{display:flex;gap:10px;align-items:center;font-weight:400} .chk input{width:22px;height:22px;min-height:0;accent-color:var(--t)}
  .swapbox select{font:inherit;padding:8px;border:1px solid #8a8681;border-radius:8px;margin-top:4px;width:100%}
  .pick{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin:8px 0;font-size:18px;font-weight:600}
  .neg{color:#a4262c} details summary{cursor:pointer;list-style:none} details summary h2{display:inline;margin:0} details summary::-webkit-details-marker{display:none}
  details summary::after{content:" ▾";color:var(--dim)}
  .auth{max-width:420px;margin:30px auto} .err{color:#a4262c;font-weight:600} .ok{color:#0b5a0b;font-weight:600}
  .who{font-size:13px;opacity:.9} .rankrow .pos{font:800 22px/1 Inter,system-ui;width:44px;text-align:center}
  .pole{background:linear-gradient(135deg,#fff8e1,#fff);border-color:#e8c547} .code{font:700 28px/1.2 ui-monospace,monospace;letter-spacing:.12em}
  .wheel{position:relative;height:330px;perspective:1000px;overflow:hidden;touch-action:none;margin-top:6px;border-radius:16px;background:radial-gradient(110% 80% at 50% 30%,#fff7e6,#ffd9b8)}
  .wheel .drum{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
  .wcard{position:absolute;left:-110px;top:-110px;width:220px;height:220px;border:0;background:none;padding:0;cursor:pointer;backface-visibility:hidden}
  .wart{position:absolute;inset:0;background-repeat:no-repeat;background-size:1200% 100%}
  .wtag{position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);white-space:nowrap;background:#fff;border-radius:99px;padding:5px 12px;font-weight:800;font-size:14px;box-shadow:0 3px 10px rgba(0,0,0,.12)}
  .wcard.front .wtag{background:var(--t);color:#fff}
  .wbtns{display:flex;gap:8px;justify-content:center;margin:8px 0}
  .scenebox{display:block;width:100%;max-width:520px;aspect-ratio:1/1.22;border:0;margin:0 auto}
  .small{font-size:12.5px}
  .roomart{position:relative;width:100%;max-width:420px;aspect-ratio:1/1;margin:0 auto;background-repeat:no-repeat;background-size:1200% 100%;background-position:45.45% 0}
  .roomart .here{position:absolute;bottom:22%;width:22%;height:34%}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<div class="wrap"><aside id="side" aria-label="Menu"></aside><main id="app" tabindex="-1"></main></div>
<nav class="tabs" aria-label="Sections"><a href="#/" data-t="home">Today</a><a href="#/board" data-t="board">Scoreboard</a><a href="#/rooms" data-t="rooms">Rooms</a><a href="#/addons" data-t="addons">Add-ons</a><a href="#/money" data-t="money">Money</a><a href="#/setup" data-t="setup">Setup</a></nav>
<script src="config.js"></script>
<script src="api.js"></script>

</body>
</html>
