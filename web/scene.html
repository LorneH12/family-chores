<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'self'; form-action 'none'">
<meta name="theme-color" content="#2f6f4f">
<title>Room scene (prototype)</title>
<style>
  html,body{margin:0;background:radial-gradient(120% 90% at 50% 10%,#fff7e6 0%,#ffe2c4 55%,#f7c59f 100%);min-height:100%;
    font:15px/1.4 "Segoe UI",system-ui,-apple-system,sans-serif;color:#2b2b2b}
  main{max-width:560px;margin:0 auto;padding:12px 12px 40px}
  h1{font-size:22px;margin:4px 0}
  .clean{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px}
  .bar{flex:1;height:12px;border-radius:99px;background:rgba(0,0,0,.12);overflow:hidden} .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffc857,#7dc36b,#2f6f4f);transition:width .6s}
  .scene{position:relative;width:100%;aspect-ratio:1/1;margin-top:6px}
  .scene svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .people{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
  .person{background:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 2px 8px rgba(0,0,0,.08);flex:1 1 220px}
  .person b{font-size:15px} .person select{width:100%;margin-top:6px;font:inherit;padding:8px;border-radius:10px;border:1px solid #c9bfb3;background:#fff;min-height:40px}
  .person .row{display:flex;gap:6px;margin-top:10px} .btn{border:0;border-radius:10px;padding:9px 12px;font:inherit;font-weight:700;cursor:pointer;min-height:40px}
  .go{background:#2f6f4f;color:#fff} .alt{background:#fff1d6;color:#7a4b00} .x{background:#f3efe9}
  .toast{position:fixed;left:50%;top:12px;transform:translateX(-50%) translateY(-120%);background:#fff;border-radius:16px;padding:10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.18);
    display:flex;gap:10px;align-items:center;max-width:92vw;transition:transform .35s;z-index:9} .toast.show{transform:translateX(-50%) translateY(0)}
  .toast svg{width:44px;height:44px;flex:none}
  .picker{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
  .pick{background:#fff;border:2px solid transparent;border-radius:14px;padding:6px;cursor:pointer;text-align:center;font:inherit;font-size:12px;font-weight:700}
  .pick svg{width:100%;height:96px} .pick[aria-pressed=true]{border-color:#2f6f4f}
  details{background:#fff;border-radius:14px;padding:14px 16px;margin-top:20px} summary{font-weight:800;cursor:pointer}
  .maker{display:grid;gap:14px;margin-top:14px} .maker label{display:grid;gap:4px;font-weight:700;font-size:13px}
  .maker select{font:inherit;padding:8px;border-radius:10px;border:1px solid #c9bfb3;min-height:40px}
  .sw{display:flex;gap:6px;flex-wrap:wrap} .sw button{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #c9bfb3;cursor:pointer}
  .sw button[aria-pressed=true]{box-shadow:0 0 0 3px #2f6f4f}
  :focus-visible{outline:3px solid #2f6f4f;outline-offset:2px}
  .note{font-size:12px;color:#4a3b2c;margin-top:28px}
</style>
</head>
<body>
<main>
  <h1>🍳 Kitchen</h1>
  <div class="clean">Sparkle <span class="bar"><i id="cbar"></i></span><span id="cpct">0%</span></div>
  <div class="scene" id="scene"><svg id="svg" viewBox="0 0 480 480" role="img" aria-label="The kitchen with family avatars doing chores"></svg></div>
  <div class="people" id="people"></div>
  <details><summary>Add someone to the room</summary><div class="picker" id="picker"></div></details>
  <details><summary>Create your own avatar</summary><div class="maker" id="maker"></div></details>
  <p class="note">Prototype: everyone here is a demo character and chores complete on a timer. In the app, avatars follow what each person picks and marks done.</p>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="scene.js"></script>
</body>
</html>
