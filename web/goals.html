<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'self'; form-action 'none'">
<meta name="theme-color" content="#2f6f4f">
<title>Goal planner (prototype)</title>
<style>
  html,body{margin:0;background:#fff8ec;font:15px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif;color:#2b2b2b}
  main{max-width:560px;margin:0 auto;padding:16px 14px 48px}
  h1{font-size:24px;margin:4px 0 2px} .sub{color:#5a4a3a;margin:0 0 18px}
  form{display:grid;gap:14px;background:#fff;border-radius:18px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  label{display:grid;gap:5px;font-weight:700;font-size:13px}
  input,select,textarea{font:inherit;padding:10px;border-radius:12px;border:1px solid #c9bfb3;background:#fff;min-height:44px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .btn{border:0;border-radius:14px;padding:13px;font:inherit;font-weight:800;background:#2f6f4f;color:#fff;cursor:pointer;min-height:48px}
  .card{background:#fff;border-radius:18px;padding:16px;margin-top:20px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  .smart{display:grid;gap:10px;margin-top:6px} .smart div{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}
  .smart b.l{width:34px;height:34px;border-radius:10px;background:#2f6f4f;color:#fff;display:grid;place-items:center;font-size:17px}
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
  .day{background:#f6f1e7;border-radius:12px;padding:8px 6px;min-height:84px;font-size:11px} .day b{display:block;font-size:12px;margin-bottom:4px}
  .chip{display:block;background:#fff;border-radius:8px;padding:4px 5px;margin-bottom:4px;line-height:1.25}
  .bar{height:14px;border-radius:99px;background:#eee3d3;overflow:hidden;margin:8px 0} .bar i{display:block;height:100%;background:linear-gradient(90deg,#ffc857,#2f6f4f)}
  .ok{color:#0b5a0b;font-weight:800} .warn{color:#8a4b00;font-weight:800}
  ul{padding-left:18px;margin:8px 0} li{margin:4px 0}
  .muted{color:#5a4a3a;font-size:13px}
  :focus-visible{outline:3px solid #2f6f4f;outline-offset:2px}
  @media (max-width:420px){.week{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<main>
  <h1>🎯 Set a goal</h1>
  <p class="sub">Your goal, your plan. Pick what you want and when; you choose the chores that get you there.</p>
  <form id="f">
    <label>What do you want? <input name="title" maxlength="80" value="New sneakers" required></label>
    <div class="two"><label>It costs (or I want to save) <input name="amount" type="number" min="1" step="0.01" value="80" required></label>
      <label>By when? <input name="date" type="date" required></label></div>
    <label>Why does it matter to you? <input name="why" maxlength="200" value="For basketball season"></label>
    <div class="two"><label>Already saved <input name="saved" type="number" min="0" step="0.01" value="10"></label>
      <label>Age group <select name="age"><option value="little">Little (4–7)</option><option value="kid">Kid (8–12)</option><option value="teen" selected>Teen (13–17)</option></select></label></div>
    <label>If something gets in the way… <select name="ifthen">
      <option>If I don't feel like it, then I'll start with the easiest chore.</option>
      <option>If I'm busy after school, then I'll do it right after dinner.</option>
      <option>If I forget, then I'll set a timer in the app.</option>
      <option>If I fall behind, then I'll add one extra chore on Saturday.</option>
      <option>If my week gets busy, then I'll claim one room instead of lots of small chores.</option></select></label>
    <button class="btn">Make my plan</button>
  </form>
  <div id="out"></div>
  <p class="muted" style="margin-top:28px">Prototype with the starter chores and prices. In the app it uses your family's real chores, your pay dials and your saved money, and checkpoints become notifications.</p>
</main>
<script src="goalplan.js"></script>
<script src="goals.js"></script>
</body>
</html>
